<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="查詢 GBO2 PS 版分級戰、快速戰的 COST 與地圖輪替，支援日期、地上與宇宙篩選及台北／日本時間。">
  <title>GBO2 PS 出擊時刻表</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1422'/%3E%3Cpath d='M7 9h18v5H7zm0 9h11v5H7z' fill='%2379e3c6'/%3E%3Cpath d='M21 18h4v5h-4z' fill='%23ffc477'/%3E%3C/svg%3E">
  <style>
    :root {font-family: "Segoe UI", "Microsoft JhengHei", sans-serif; color:#e8eef6; background:#0b111b; font-size:16px; --surface:#121d2b; --line:#263548; --muted:#a8b7c9; --rated:#79e3c6; --quick:#ffc477;}
    * {box-sizing:border-box} body {margin:0} button,input,select {font:inherit} button,select,input {color:inherit; background:#162334; border:1px solid #384b61; border-radius:7px; min-height:42px; padding:8px 12px} button {cursor:pointer} button:hover {background:#24354a} button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible {outline:3px solid #91ceff; outline-offset:3px} a {color:#91ceff} select {max-width:100%} h1,h2,h3,p {margin:0} h1 {font-size:1.8rem; letter-spacing:.02em; font-weight:700} h2 {font-size:1.15rem} h3 {font-size:1rem} small,.small {font-size:.875rem} .muted {color:var(--muted)} .mono {font-family:Consolas,"Cascadia Code",monospace; font-variant-numeric:tabular-nums}
    .wrap {width:min(1220px,calc(100% - 48px)); margin:auto} header {border-bottom:1px solid var(--line); padding:25px 0 23px} .head {display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap} .eyebrow {color:var(--rated); font-size:.875rem; font-weight:700; letter-spacing:.15em; margin-bottom:6px} .source {text-align:right; line-height:1.7; font-size:.875rem} .tag {display:inline-flex; align-items:center; padding:3px 8px; border:1px solid #405166; border-radius:5px; font-size:.75rem; line-height:1.5; white-space:nowrap} main {padding:24px 0 38px} .controls {padding:18px; border:1px solid var(--line); border-radius:10px; background:var(--surface)} .controls-top {display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px} .mode-buttons {display:flex; gap:5px; flex-wrap:wrap} .mode-buttons button {background:transparent; border-color:transparent} .mode-buttons button[aria-pressed="true"] {color:#071a16; background:var(--rated); border-color:var(--rated); font-weight:700} .filters {display:grid; grid-template-columns:1.1fr .85fr 1.45fr 1fr; gap:16px} label {display:grid; gap:8px; font-size:.875rem; color:var(--muted)} label select {color:#e8eef6; width:100%} .query-hint {font-size:.875rem; color:var(--muted); margin-top:13px; line-height:1.6} .section-head {display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:27px 0 13px} .countdown {font-size:.875rem; color:var(--muted)} .countdown strong {color:var(--rated)} .current-grid {display:grid; grid-template-columns:1fr 1fr; gap:16px} .mode-panel {border:1px solid var(--line); background:var(--surface); border-radius:10px; overflow:hidden} .panel-heading {padding:13px 17px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:12px} .rated .panel-heading {border-top:3px solid var(--rated)} .quick .panel-heading {border-top:3px solid var(--quick)} .rated .panel-heading h3 {color:var(--rated)} .quick .panel-heading h3 {color:var(--quick)} .match {padding:14px 17px; display:grid; grid-template-columns:83px 1fr; gap:15px; border-bottom:1px solid var(--line); min-width:0} .match:last-child {border-bottom:0} .cost {font-size:1.9rem; line-height:1.2; font-weight:700; letter-spacing:-.03em} .cost-title {color:var(--muted); font-size:.75rem; letter-spacing:.1em; margin-bottom:2px} .unlimited {font-size:1.1rem; padding-top:6px} .map-title {font-weight:600; line-height:1.45} .match-meta {color:var(--muted); font-size:.875rem; margin-top:5px; line-height:1.6; display:flex; gap:9px; align-items:center; flex-wrap:wrap} .special {color:var(--quick); border-color:#765839} details {font-size:.875rem; margin-top:8px; color:var(--muted)} summary {cursor:pointer; width:fit-content; line-height:1.6} .pool {display:flex; flex-wrap:wrap; gap:6px; margin-top:9px} .pool span {background:#1d2b3e; padding:4px 7px; border-radius:4px; line-height:1.4} .pool span.selected {color:#d7ffe8; background:#24453a; box-shadow:inset 0 0 0 1px #4b977a} .empty {padding:28px 17px; color:var(--muted); line-height:1.8} .day-toolbar {display:flex; gap:8px; align-items:center; flex-wrap:wrap} .date-input {width:156px} #day-label {color:var(--muted); font-size:.875rem; font-weight:400; margin-left:10px} .timeline {display:grid; gap:12px} .time-row {display:grid; grid-template-columns:140px 1fr; gap:16px; padding:16px; border:1px solid var(--line); border-radius:10px; background:#101a28} .time-row.active {border-color:#4f8f83; background:#112522; box-shadow:inset 3px 0 var(--rated)} .time-label {font-weight:650; font-size:1.1rem; line-height:1.6} .date-fragment {font-size:.75rem; color:var(--muted); margin-bottom:4px} .time-label .tag {margin-top:7px; color:var(--rated); border-color:#43675c} .timeline-groups {display:grid; grid-template-columns:1fr 1fr; gap:14px} .group-title {font-size:.875rem; margin-bottom:9px; color:var(--rated)} .quick-group .group-title {color:var(--quick)} .compact-match {background:#182536; border:1px solid #29394d; border-radius:7px; padding:11px 12px; margin-bottom:8px; display:grid; grid-template-columns:62px 1fr; gap:12px; min-width:0} .compact-match:last-child {margin-bottom:0} .compact-match .cost {font-size:1.4rem} .compact-match .unlimited {font-size:.875rem} .compact-match .match-meta {font-size:.8125rem; gap:6px} .compact-match .map-title {font-size:.9375rem} .single {grid-template-columns:1fr} footer {border-top:1px solid var(--line); padding:22px 0 30px; color:var(--muted); font-size:.875rem; line-height:1.8} .footer-line {display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap} .note {margin-bottom:7px; max-width:900px} .error {background:#38202a; border:1px solid #9b526c; border-radius:8px; padding:18px; line-height:1.7} #status {padding:20px 0} [hidden] {display:none!important}
    @media(min-width:1000px) {.controls {position:sticky; top:10px; z-index:2; box-shadow:0 8px 25px #0003; backdrop-filter:blur(12px)}}
    @media(max-width:800px) {.wrap {width:calc(100% - 32px)} .filters {grid-template-columns:1fr 1fr} .current-grid {grid-template-columns:1fr} .time-row {grid-template-columns:1fr; gap:12px} .time-label {display:flex; align-items:center; gap:12px; flex-wrap:wrap} .time-label .tag {margin:0} .date-fragment {margin:0} .source {text-align:left} .section-head {align-items:flex-start}}
    @media(max-width:500px) {header {padding:20px 0} h1 {font-size:1.5rem} .wrap {width:calc(100% - 24px)} main {padding-top:16px} .controls {padding:14px} .filters {gap:12px} .timeline-groups {grid-template-columns:1fr} .time-row {padding:13px} .day-toolbar {width:100%} .day-toolbar button {padding:8px} .date-input {width:144px} .match {padding:13px; grid-template-columns:72px 1fr; gap:10px} .source {font-size:.8125rem} #day-label {display:block; margin:7px 0 0} .group-title {margin-top:2px}}
    @media(prefers-reduced-motion:no-preference) {button {transition:background .15s ease} html {scroll-behavior:smooth}}
  </style>
</head>
<body>
  <header><div class="wrap head"><div><div class="eyebrow mono">GBO2 / PLAYSTATION</div><h1>出擊時刻表 <span class="tag">POC</span></h1></div><div class="source"><div>輪替快照 <strong class="mono" id="version" data-version>載入中</strong></div><div class="muted" id="data-date">讀取資料日期…</div></div></div></header>
  <main class="wrap">
    <section class="controls" aria-label="場次篩選">
      <div class="controls-top"><div class="mode-buttons" role="group" aria-label="戰鬥模式"><button data-mode="all" aria-pressed="true">全部場次</button><button data-mode="rated" aria-pressed="false">分級戰</button><button data-mode="quick" aria-pressed="false">快速戰</button></div><button id="reset" class="small">清除篩選</button></div>
      <div class="filters"><label>COST<select id="cost"><option value="all">全部 COST</option></select></label><label>戰場<select id="environment"><option value="all">地上與宇宙</option><option value="ground">地上</option><option value="space">宇宙</option></select></label><label>地圖（含隨機地圖池）<select id="map"><option value="all">全部地圖</option></select></label><label>顯示時區<select id="timezone"><option value="480">台北 UTC+8</option><option value="540">日本 UTC+9</option><option value="0">UTC</option></select></label></div>
      <p class="query-hint">依 PS 輪替表推算，正式服更新後可能變動。隨機場次顯示候選地圖，並非每場抽選結果。</p>
    </section>
    <div id="status" role="status">讀取排程中…</div>
    <section id="current-section" aria-labelledby="current-title" hidden><div class="section-head"><h2 id="current-title">目前時段 <span class="mono muted small" id="current-time"></span></h2><div class="countdown" id="countdown"></div></div><div id="current" class="current-grid"></div></section>
    <section id="day-section" aria-labelledby="day-title" hidden><div class="section-head"><h2 id="day-title">當日時刻表 <span id="day-label"></span></h2><div class="day-toolbar"><button id="previous" aria-label="查詢前一天">前一天</button><input class="date-input" id="date" type="date" aria-label="查詢日期"><button id="next" aria-label="查詢後一天">後一天</button><button id="today">今天</button></div></div><p class="muted small" id="result-count" role="status" style="margin-bottom:14px"></p><div id="timeline" class="timeline"></div></section>
    <noscript><p class="error">請啟用 JavaScript，以查詢不同日期與篩選場次。</p></noscript>
  </main>
  <footer><div class="wrap"><p class="note">特殊場次依已核對的官方活動期間顯示，情境機體採用目前快照的專用配置。此 POC 不會即時確認維護、活動變更或最新排程。</p><div class="footer-line"><span>非官方查詢 POC · PS TSS <span class="mono" data-version>載入中</span></span><span><a href="schedule-data.json">查看排程資料</a> · <a href="https://bo2.ggame.jp/tw/info/" target="_blank" rel="noopener noreferrer">活動公告</a> · <a href="https://bo2.ggame.jp/tw/" target="_blank" rel="noopener noreferrer">官方網站</a></span></div></div></footer>
  <script type="module" src="app.mjs?v=4"></script>
</body>
</html>
